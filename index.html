<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>你好</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #111111;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    main {
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <main>你好</main>
</body>
</html>
